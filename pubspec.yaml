name: health_archive
description: 健康档案 - 个人健康管理 App（MVP）
publish_to: 'none'
version: 1.6.6+16

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 让系统自带组件（如日期、提示）显示中文，属于 Flutter SDK 自带，不是第三方库
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 本地数据库（跨端：Android/iOS/Web），用于 V0.3 真实健康数据录入与保存
  drift: ^2.25.0
  drift_flutter: ^0.2.0
  path: ^1.9.0
  # V0.4A：选择化验单图片（跨 Android/iOS/Web）
  file_picker: ^12.1.1
  # V0.4A：移动端把原始图片落盘到应用文档目录
  path_provider: ^2.1.4
  # V0.4B：拍摄检查报告（仅移动端调用相机）
  image_picker: ^1.1.2
  # V0.4B：Remote 识别后端 HTTP 调用
  http: ^1.2.2
  # 显式设置 multipart 图片上传的 Content-Type（image/jpeg、image/png）
  http_parser: ^4.0.2
  # V0.5：匿名身份 token / 恢复码 安全存储（Android Keystore / iOS Keychain）
  flutter_secure_storage: ^11.0.0
  # V0.5：Web 预览时的本地身份存储回退
  shared_preferences: ^2.3.2
  # V0.5.1：本地完整备份（JSON+报告原图打包成 zip），免服务器的备份方案
  archive: ^3.6.1
  # V0.5.1：把导出的备份文件通过系统分享面板发到微信/网盘等 App
  share_plus: ^13.3.0
  fl_chart: ^1.2.0
  # A3：导入 PDF 报告时把首页渲染成图片，交给现有 OCR / 识别流程（移动端用 pdfium）
  pdfx: ^2.9.1
  # B2：本地系统通知（复查提醒 / 服药提醒），按设备时区定时
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.13
  # V0.5.1：测试里伪造应用文档目录（本地备份/恢复的路径依赖）
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
