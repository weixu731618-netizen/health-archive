              contentPadding: EdgeInsets.zero,\n              leading:\n                  const Icon(Icons.calendar_today, color: AppColors.textSecondary),\n              title: const Text('测量日期',\n                  style: TextStyle(fontSize: 15, color: AppColors.textPrimary)),\n              trailing: Text(formatDate(_date),\n                  style: const TextStyle(\n                      fontSize: 15, color: AppColors.textPrimary)),\n              onTap: _pickDate,\n            ),\n            ListTile(\n              contentPadding: EdgeInsets.zero,\n              leading: const Icon(Icons.access_time, color: AppColors.textSecondary),\n              title: const Text('测量时间',\n                  style: TextStyle(fontSize: 15, color: AppColors.textPrimary)),\n              trailing: Text(\n                  '${_time.hour.toString().padLeft(2, '0')}:${_time.minute.toString().padLeft(2, '0')}',\n                  style: const TextStyle(\n                      fontSize: 15, color: AppColors.textPrimary)),\n              onTap: _pickTime,\n            ),\n            const SizedBox(height: 4),\n            TextFormField(\n              controller: _notesCtrl,\n              maxLines: 2,\n              decoration: _input('备注（选填）', '补充说明，可留空'),\n            ),\n            const SizedBox(height: 24),\n            FilledButton(\n              onPressed: _save,\n              style: FilledButton.styleFrom(\n                  padding: const EdgeInsets.symmetric(vertical: 14)),\n              child: const Text('保存', style: TextStyle(fontSize: 16)),\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n\n  String get _unit {\n    switch (_r.type) {\n      case 'blood_glucose':\n        return 'mmol/L';\n      case 'blood_pressure':\n        return 'mmHg';\n      case 'weight':\n        return 'kg';\n      case 'heart_rate':\n        return 'bpm';\n      default:\n        return _r.unit;\n    }\n  }\n\n  InputDecoration _input(String label, String hint) {\n    return InputDecoration(\n      labelText: label,\n      hintText: hint,\n      border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),\n    );\n  }\n\n  Future<void> _pickDate() async {\n    final picked = await showDatePicker(\n      context: context,\n      initialDate: _date,\n      firstDate: DateTime(2015),\n      lastDate: DateTime.now().add(const Duration(days: 1)),\n    );\n    if (picked != null) setState(() => _date = picked);\n  }\n\n  Future<void> _pickTime() async {\n    final picked = await showTimePicker(context: context, initialTime: _time);\n    if (picked != null) setState(() => _time = picked);\n  }\n\n  Future<void> _save() async {\n    if (!_formKey.currentState!.validate()) return;\n    final repo = appRepository!;\n    final dt = DateTime(\n        _date.year, _date.month, _date.day, _time.hour, _time.minute);\n    final updated = _r.copyWith(\n      value1: double.parse(_value1Ctrl.text.trim()),\n      value2: _r.type == 'blood_pressure'\n          ? Value(double.parse(_value2Ctrl.text.trim()))\n          : Value(_r.value2),\n      measuredAt: dt,\n      notes: Value(_notesCtrl.text.trim().isEmpty ? null : _notesCtrl.text.trim()),\n    );\n    await repo.updateDaily(updated);\n    if (!mounted) return;\n    ScaffoldMessenger.of(context)\n      ..hideCurrentSnackBar()\n      ..showSnackBar(const SnackBar(content: Text('保存成功')));\n    Navigator.of(context).pop(true);\n  }\n}\nEOF\necho \"APPENDED\"; tail -3 \"D:\\健康ios项目mvp-20260819\\lib\\pages\\daily_health_entry_page.dart\"", "Bash=export PATH=\"/d/development/flutter/bin:$PATH\" && export PUB_HOSTED_URL=https://pub.flutter-io.cn && export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn && cd \"D:\\健康ios项目mvp-20260819\" && flutter test test/compile_check_test.dart 2>&1 | tail -30", "Bash=export PATH=\"/d/development/flutter/bin:$PATH\" && export PUB_HOSTED_URL=https://pub.flutter-io.cn && export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn && cd \"D:\\健康ios项目mvp-2026